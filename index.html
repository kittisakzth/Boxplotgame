<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Box Plot Motion Challenge</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      color: white;
      font-family: 'Tahoma', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game-container {
      position: relative;
      width: 1280px;
      height: 720px;
      box-shadow: 0 0 20px rgba(0,255,200,0.3);
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    video { display: none; }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 720px;
    }
    #loading-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      color: #00FFCC;
      text-align: center;
      z-index: 10;
      line-height: 1.6;
      width: 80%;
    }
  </style>

  <!-- MediaPipe Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <h2>📊 Box Plot Motion Challenge (Web Edition)</h2>
  <div id="game-container">
    <div id="loading-text">กำลังเริ่มต้นระบบ...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const loadingText = document.getElementById('loading-text');

    let hands = null;
    let camera = null;
    let cx = -1, cy = -1, isPinching = false;

    const NUM_DATA = 11;
    let stage = 1, quizStep = 1, score = 0;
    let startTime = Date.now(), timeLimit = 120;
    let dataRaw = [], dataSorted = [], minVal, q1Val, q2Val, q3Val, maxVal;
    let cards = [], slots = [], tags = [];
    let lastClickTime = 0;
    let quizOptions = null;

    function generateCleanData() {
      const numDuplicates = Math.random() < 0.5 ? 2 : 3;
      const uniqueCount = NUM_DATA - numDuplicates;
      let baseNumbers = [];
      while(baseNumbers.length < uniqueCount) {
        let r = Math.floor(Math.random() * 20) + 1;
        if(!baseNumbers.includes(r)) baseNumbers.push(r);
      }
      let duplicates = [];
      for(let i=0; i<numDuplicates; i++) {
        duplicates.push(baseNumbers[Math.floor(Math.random()*baseNumbers.length)]);
      }
      dataRaw = baseNumbers.concat(duplicates);
      dataSorted = [...dataRaw].sort((a,b) => a - b);
      
      // กำหนดตำแหน่งสถิติถูกต้องตาม N = 11
      // index 0 -> ตัวที่ 1 (Min)
      // index 2 -> ตัวที่ 3 (Q1)
      // index 5 -> ตัวที่ 6 (Q2)
      // index 8 -> ตัวที่ 9 (Q3)
      // index 10 -> ตัวที่ 11 (Max)
      minVal = dataSorted[0];
      q1Val = dataSorted[2];
      q2Val = dataSorted[5];
      q3Val = dataSorted[8];
      maxVal = dataSorted[10];

      cards = [];
      let shuffled = [...dataRaw].sort(() => Math.random() - 0.5);
      shuffled.forEach((val, i) => {
        let startX = 60 + (i % 6) * 110;
        let startY = 100 + Math.floor(i / 6) * 105;
        cards.push({ 
          id: i,
          value: val, 
          x: startX, 
          y: startY, 
          initX: startX,
          initY: startY,
          w: 90, 
          h: 85, 
          isGrabbed: false,
          placedSlotIndex: null
        });
      });

      // ช่องวางด่านที่ 1 (#1 ซ้ายสุด -> #11 ขวาสุด)
      slots = [];
      const slotWidth = 90;
      const slotGap = 15;
      const startX = 60;
      for(let i=0; i<NUM_DATA; i++) {
        slots.push({ 
          x: startX + i * (slotWidth + slotGap), 
          y: 480, 
          w: slotWidth, 
          h: 95, 
          cardId: null,
          filledVal: null 
        });
      }

      // ป้ายตำแหน่งสำหรับด่านที่ 2 (ระบุ targetIndex ตรงจุด)
      tags = [
        { name: "Min", targetIndex: 0, x: 120, y: 150, initX: 120, initY: 150, w: 90, h: 55, isGrabbed: false, isPlaced: false },
        { name: "Q1",  targetIndex: 2, x: 340, y: 150, initX: 340, initY: 150, w: 90, h: 55, isGrabbed: false, isPlaced: false },
        { name: "Q2",  targetIndex: 5, x: 560, y: 150, initX: 560, initY: 150, w: 90, h: 55, isGrabbed: false, isPlaced: false },
        { name: "Q3",  targetIndex: 8, x: 780, y: 150, initX: 780, initY: 150, w: 90, h: 55, isGrabbed: false, isPlaced: false },
        { name: "Max", targetIndex: 10, x: 1000, y: 150, initX: 1000, initY: 150, w: 90, h: 55, isGrabbed: false, isPlaced: false }
      ].sort(() => Math.random() - 0.5);
    }

    generateCleanData();

    function drawText(text, x, y, size=28, color="#FFFFFF", align="left") {
      ctx.save();
      ctx.font = `bold ${size}px Tahoma, sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.shadowColor = "rgba(0,0,0,0.8)";
      ctx.shadowBlur = 6;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function drawButton(text, x, y, w, h, bgColor="#E0E0E0", fontSize=28) {
      ctx.save();
      ctx.fillStyle = bgColor;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "#333333";
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);
      drawText(text, x + w/2, y + h/2 + fontSize/3, fontSize, "#000000", "center");
      ctx.restore();
    }

    function checkOverlap(px, py, rx, ry, rw, rh) {
      return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;
    }

    function drawBoxplot(start_x=140, start_y=200, width=1000) {
      ctx.fillStyle = "rgba(245, 245, 245, 0.95)";
      ctx.fillRect(start_x - 30, start_y - 20, width + 60, 140);
      ctx.strokeStyle = "#B0B0B0";
      ctx.lineWidth = 2;
      ctx.strokeRect(start_x - 30, start_y - 20, width + 60, 140);

      const lineY = start_y + 80;
      ctx.beginPath();
      ctx.moveTo(start_x, lineY); ctx.lineTo(start_x + width, lineY);
      ctx.strokeStyle = "#333333"; ctx.lineWidth = 3; ctx.stroke();

      const valToX = v => start_x + ((v - 1) / 19.0) * width;

      for (let v = 1; v <= 20; v++) {
        let vx = valToX(v);
        ctx.beginPath(); ctx.moveTo(vx, lineY - 5); ctx.lineTo(vx, lineY + 5);
        ctx.strokeStyle = "#666666"; ctx.lineWidth = 2; ctx.stroke();
        if (v % 2 !== 0 || v === 20) drawText(v.toString(), vx, lineY + 30, 20, "#000000", "center");
      }

      let xMin = valToX(minVal), xQ1 = valToX(q1Val), xQ2 = valToX(q2Val), xQ3 = valToX(q3Val), xMax = valToX(maxVal);
      let boxY = start_y + 10, boxH = 45;

      ctx.beginPath();
      ctx.moveTo(xMin, boxY + boxH/2); ctx.lineTo(xQ1, boxY + boxH/2);
      ctx.moveTo(xQ3, boxY + boxH/2); ctx.lineTo(xMax, boxY + boxH/2);
      ctx.moveTo(xMin, boxY + 10); ctx.lineTo(xMin, boxY + boxH - 10);
      ctx.moveTo(xMax, boxY + 10); ctx.lineTo(xMax, boxY + boxH - 10);
      ctx.strokeStyle = "#C00000"; ctx.lineWidth = 3; ctx.stroke();

      ctx.fillStyle = "#FFE699"; ctx.fillRect(xQ1, boxY, xQ3 - xQ1, boxH);
      ctx.strokeStyle = "#0064C8"; ctx.lineWidth = 3; ctx.strokeRect(xQ1, boxY, xQ3 - xQ1, boxH);

      ctx.beginPath(); ctx.moveTo(xQ2, boxY); ctx.lineTo(xQ2, boxY + boxH);
      ctx.strokeStyle = "#FF0000"; ctx.lineWidth = 4; ctx.stroke();
    }

    function onResults(results) {
      if (loadingText.style.display !== 'none') {
        loadingText.style.display = 'none';
      }

      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      cx = -1; cy = -1; isPinching = false;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        const indexFinger = landmarks[8];
        const thumb = landmarks[4];

        cx = (1.0 - indexFinger.x) * canvas.width;
        cy = indexFinger.y * canvas.height;
        const tx = (1.0 - thumb.x) * canvas.width;
        const ty = thumb.y * canvas.height;

        let dist = Math.hypot(cx - tx, cy - ty);
        let currentlyHolding = cards.some(c => c.isGrabbed) || tags.some(t => t.isGrabbed);
        let threshold = currentlyHolding ? 75 : 45;

        if (dist < threshold) isPinching = true;
      }

      let elapsed = Math.floor((Date.now() - startTime) / 1000);
      let timeLeft = Math.max(0, timeLimit - elapsed);

      if (stage === 1) {
        drawText(`ด่านที่ 1: เรียงข้อมูลจากน้อยไปมาก (จากซ้ายไปขวา)`, 40, 50, 30);
        drawText(`เวลา: ${timeLeft}s | คะแนน: ${score}`, 950, 50, 30, "#00FFFF");

        slots.forEach((s, i) => {
          ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
          ctx.fillRect(s.x, s.y, s.w, s.h);
          ctx.strokeStyle = s.cardId !== null ? "#64FF64" : "#FFFFFF";
          ctx.lineWidth = 3;
          ctx.strokeRect(s.x, s.y, s.w, s.h);
          drawText(`#${i+1}`, s.x + s.w/2, s.y - 12, 20, "#00FFCC", "center");
        });

        if (isPinching) {
          let grabbedCard = cards.find(c => c.isGrabbed);
          if (!grabbedCard) {
            for (let i = cards.length - 1; i >= 0; i--) {
              let card = cards[i];
              if (checkOverlap(cx, cy, card.x, card.y, card.w, card.h)) {
                card.isGrabbed = true;
                cards.splice(i, 1);
                cards.push(card);

                if (card.placedSlotIndex !== null) {
                  slots[card.placedSlotIndex].cardId = null;
                  slots[card.placedSlotIndex].filledVal = null;
                  card.placedSlotIndex = null;
                }
                break;
              }
            }
          }
        } else {
          cards.forEach(card => {
            if (card.isGrabbed) {
              card.isGrabbed = false;
              let placed = false;
              slots.forEach((slot, sIdx) => {
                let cardCenterX = card.x + card.w/2;
                let cardCenterY = card.y + card.h/2;
                
                let distToSlot = Math.hypot(cardCenterX - (slot.x + slot.w/2), cardCenterY - (slot.y + slot.h/2));
                if (!placed && slot.cardId === null && distToSlot < 65) {
                  slot.cardId = card.id;
                  slot.filledVal = card.value;
                  card.placedSlotIndex = sIdx;
                  card.x = slot.x + (slot.w - card.w) / 2;
                  card.y = slot.y + (slot.h - card.h) / 2;
                  placed = true;
                }
              });

              if (!placed && card.placedSlotIndex === null) {
                card.x = card.initX;
                card.y = card.initY;
              }
            }
          });
        }

        cards.forEach(card => {
          if (card.isGrabbed) {
            card.x = cx - card.w / 2;
            card.y = cy - card.h / 2;
          }
          drawButton(card.value.toString(), card.x, card.y, card.w, card.h, card.isGrabbed ? "#FF9600" : "#FFC864");
        });

        let currentSeq = slots.map(s => s.filledVal);
        if (!currentSeq.includes(null)) {
          if (JSON.stringify(currentSeq) === JSON.stringify(dataSorted)) {
            score += 300 + (timeLeft * 10);
            stage = 2;
            startTime = Date.now();
          } else {
            drawText("เรียงลำดับไม่ถูกต้อง! ลองใหม่อีกครั้ง", 640, 670, 30, "#FF3333", "center");
          }
        }
      } else if (stage === 2) {
        drawText("ด่านที่ 2: ลากป้าย Min, Q1, Q2, Q3, Max ไปวางบนตำแหน่งตัวเลขให้ถูกต้อง", 40, 50, 26);
        drawText(`เวลา: ${timeLeft}s | คะแนน: ${score}`, 950, 50, 30, "#00FFFF");

        // แสดงกล่องตัวเลขเรียง 1-11
        dataSorted.forEach((val, i) => {
          let x = 60 + i * 105, y = 420;
          drawButton(val.toString(), x, y, 90, 85, "#C8FFC8");
          drawText(`#${i+1}`, x + 45, y + 115, 18, "#00FFCC", "center");
        });

        if (isPinching) {
          let grabbedTag = tags.find(t => t.isGrabbed);
          if (!grabbedTag) {
            for (let i = tags.length - 1; i >= 0; i--) {
              let tag = tags[i];
              if (!tag.isPlaced && checkOverlap(cx, cy, tag.x, tag.y, tag.w, tag.h)) {
                tag.isGrabbed = true;
                tags.splice(i, 1);
                tags.push(tag);
                break;
              }
            }
          }
        } else {
          tags.forEach(tag => {
            if (tag.isGrabbed) {
              tag.isGrabbed = false;
              let placed = false;
              
              // ตรวจสอบตำแหน่งที่ผู้เล่นนำไปวาง (อ้างอิงจาก targetIndex 0, 2, 5, 8, 10)
              let targetX = 60 + tag.targetIndex * 105;
              let targetY = 420;
              let distToTarget = Math.hypot((tag.x + tag.w/2) - (targetX + 45), (tag.y + tag.h/2) - (targetY - 30));
              
              if (distToTarget < 75) {
                tag.isPlaced = true;
                tag.x = targetX;
                tag.y = targetY - 65; // วางลอยบนกล่องพอดี ไม่บังตัวเลข
                score += 100;
                placed = true;
              }

              if (!placed) {
                tag.x = tag.initX;
                tag.y = tag.initY;
              }
            }
          });
        }

        let correctCount = 0;
        tags.forEach(tag => {
          if (tag.isGrabbed) {
            tag.x = cx - tag.w / 2;
            tag.y = cy - tag.h / 2;
          }
          if (tag.isPlaced) correctCount++;
          drawButton(tag.name, tag.x, tag.y, tag.w, tag.h, tag.isPlaced ? "#64FF64" : "#FF9696");
        });

        if (correctCount === 5) {
          score += (timeLeft * 10);
          stage = 3; quizStep = 1; quizOptions = null;
        }
      } else if (stage === 3) {
        drawText(`ด่านที่ 3: คำถามวิเคราะห์ข้อมูล (ข้อ ${quizStep}/3)`, 640, 50, 32, "#FFFFFF", "center");
        drawText(`คะแนน: ${score}`, 1050, 50, 30, "#00FFFF");

        let now = Date.now();
        let isClickable = (now - lastClickTime) > 1200;

        if (quizStep === 1) {
          if (!quizOptions) {
            let correct = q2Val, wrong = q2Val + (Math.random() < 0.5 ? 2 : -2);
            let side = Math.random() < 0.5 ? 'left' : 'right';
            quizOptions = {
              q: "ข้อที่ 1/3: ค่ามัธยฐาน (ค่ากลาง หรือ Q2) ของข้อมูลชุดนี้เท่ากับเท่าใด?",
              cA: side === 'left' ? `ก) ${correct}` : `ก) ${wrong}`,
              cB: side === 'left' ? `ข) ${wrong}` : `ข) ${correct}`,
              isACorrect: side === 'left'
            };
          }
        } else if (quizStep === 2) {
          if (!quizOptions) {
            let range = maxVal - minVal;
            let correct = range, wrong = range + (Math.random() < 0.5 ? 2 : -2);
            let side = Math.random() < 0.5 ? 'left' : 'right';
            quizOptions = {
              q: "ข้อที่ 2/3: ค่าพิสัย (ค่าสูงสุด - ค่าต่ำสุด) ของข้อมูลชุดนี้เท่ากับเท่าใด?",
              cA: side === 'left' ? `ก) ${correct}` : `ก) ${wrong}`,
              cB: side === 'left' ? `ข) ${wrong}` : `ข) ${correct}`,
              isACorrect: side === 'left'
            };
          }
        } else if (quizStep === 3) {
          drawBoxplot();
          if (!quizOptions) {
            let isMaxDisp = Math.random() < 0.5;
            let intervals = {
              [`ช่วง ${minVal} ถึง ${q1Val}`]: q1Val - minVal,
              [`ช่วง ${q1Val} ถึง ${q2Val}`]: q2Val - q1Val,
              [`ช่วง ${q2Val} ถึง ${q3Val}`]: q3Val - q2Val,
              [`ช่วง ${q3Val} ถึง ${maxVal}`]: maxVal - q3Val
            };
            let keys = Object.keys(intervals);
            keys.sort((a,b) => isMaxDisp ? intervals[b] - intervals[a] : intervals[a] - intervals[b]);
            let correct = keys[0], wrong = keys[1];
            let side = Math.random() < 0.5 ? 'left' : 'right';
            quizOptions = {
              q: isMaxDisp ? "ข้อที่ 3/3: ข้อมูล \"กระจายตัวมากที่สุด\" (กว้างที่สุด) ในช่วงใด?" : "ข้อที่ 3/3: ข้อมูล \"กระจายตัวน้อยที่สุด\" (แคบที่สุด) ในช่วงใด?",
              cA: side === 'left' ? `ก) ${correct}` : `ก) ${wrong}`,
              cB: side === 'left' ? `ข) ${wrong}` : `ข) ${correct}`,
              isACorrect: side === 'left'
            };
          }
        }

        if (quizOptions) {
          drawText(quizOptions.q, 640, quizStep === 3 ? 120 : 160, 28, "#FFFF00", "center");
          let btnY = quizStep === 3 ? 370 : 260;
          let btnH = quizStep === 3 ? 150 : 180;

          drawButton(quizOptions.cA, 140, btnY, 460, btnH, "#FFC8C8", 30);
          drawButton(quizOptions.cB, 680, btnY, 460, btnH, "#C8C8FF", 30);

          if (isClickable && cx !== -1 && cy !== -1) {
            if (checkOverlap(cx, cy, 140, btnY, 460, btnH)) {
              if (quizOptions.isACorrect) score += 300;
              quizStep++; quizOptions = null; lastClickTime = now;
              if (quizStep > 3) stage = 4;
            } else if (checkOverlap(cx, cy, 680, btnY, 460, btnH)) {
              if (!quizOptions.isACorrect) score += 300;
              quizStep++; quizOptions = null; lastClickTime = now;
              if (quizStep > 3) stage = 4;
            }
          }
        }
        drawText("ใช้นิ้วชี้แตะเลือกตัวเลือก ก) หรือ ข) บนหน้าจอ", 640, 650, 26, "#E0E0E0", "center");
      } else if (stage === 4) {
        ctx.fillStyle = "rgba(0,0,0,0.85)";
        ctx.fillRect(200, 150, 880, 420);
        ctx.strokeStyle = "#00FFFF";
        ctx.lineWidth = 4;
        ctx.strokeRect(200, 150, 880, 420);

        drawText("🎉 ตอบคำถามครบทุกข้อแล้ว!", 640, 240, 44, "#00FF00", "center");
        drawText(`คะแนนรวมทั้งหมด: ${score}`, 640, 360, 38, "#FFFFFF", "center");
        drawText("รีเฟรชหน้าเว็บ (F5) เพื่อเริ่มเล่นใหม่อีกครั้ง", 640, 460, 26, "#AAAAAA", "center");
      }

      if (cx !== -1 && cy !== -1) {
        ctx.beginPath();
        ctx.arc(cx, cy, 15, 0, 2 * Math.PI);
        ctx.fillStyle = isPinching ? "#00FF00" : "#FF0000";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#FFFFFF";
        ctx.stroke();
      }
    }

    async function initSystem() {
      try {
        loadingText.innerText = "กำลังเริ่มต้นระบบตรวจจับมือ MediaPipe...";

        hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        loadingText.innerText = "กำลังเชื่อมต่อกับกล้องเว็บแคม...";

        camera = new Camera(video, {
          onFrame: async () => {
            await hands.send({ image: video });
          },
          width: 1280,
          height: 720
        });

        await camera.start();
      } catch (err) {
        console.error("Init Error:", err);
        loadingText.innerHTML = `❌ เกิดข้อผิดพลาด: ${err.message || "ไม่สามารถโหลดระบบได้"}<br>กรุณาตรวจสอบว่ายินยอมให้ใช้งานกล้องแล้วรีเฟรชอีกครั้ง`;
      }
    }

    window.addEventListener('load', initSystem);
  </script>
</body>
</html>
